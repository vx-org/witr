name: Runtime packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ["witr-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  packages:
    permissions:
      contents: write
    uses: vx-org/vx-rez-packages/.github/workflows/runtime-release.yml@8099f1eb02e846f1107e6e0618ea38bb0997467a
    with:
      definition: recipe.json
      tooling-ref: 8099f1eb02e846f1107e6e0618ea38bb0997467a
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/witr-') }}
